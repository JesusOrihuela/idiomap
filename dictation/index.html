    <script>(function(){if(typeof AppLang==='undefined')return;document.querySelectorAll('.mode-switcher .btn-label[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n'),t=AppLang.t(k);if(t!==k)e.textContent=t;});}());</script>

    <main class="dictation-page container" id="main-content">


        <!-- Topic Picker (shown on first load) -->
        <div id="topic-picker">
            <div class="dict-header page-header">
                <h1 class="page-header__title" data-i18n-html="dictation_page_title"></h1>
                <p class="page-header__sub" data-i18n="dictation_picker_sub"></p>
            </div>

            <div class="topic-grid" id="topic-grid">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Exercise Area (hidden until topic chosen) -->
        <div id="exercise-area" class="hidden">

            <!-- Session bar -->
            <div class="session-info-bar">
                <button class="btn btn--ghost btn--sm btn--back" id="back-btn" data-i18n="back_to_topics"></button>
                <span id="dict-counter" class="session-counter"></span>
                <span class="streak-badge" id="dict-streak"></span>
            </div>
            <div class="progress-bar session-progress-bar" id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la sesión" data-i18n-aria="session_progress_aria"><div class="progress-bar__fill session-progress-fill" id="session-progress-fill"></div></div>

            <h1 class="page-header__title dict-title" data-i18n-html="dictation_title"></h1>
            <p class="page-header__sub dict-subtitle" data-i18n="dictation_sub"></p>

            <!-- Audio card: the phrase is audio-only, so the card holds the
                 metadata and a speaker mark, and the action goes below. -->
            <div class="phrase-card phrase-card--optical dict-card" id="dict-card">
                <div class="dict-slots-wrap">
                    <div class="dict-slots" id="dict-slots" aria-hidden="true"></div>
                    <span class="dict-word-count" id="dict-word-count"></span>
                </div>
            </div>

            <!-- Listen action -->
            <div class="dict-listen-row">
                <button id="play-btn" class="btn btn--secondary play-btn" data-i18n-aria="listen_phrase_aria">
                    <svg class="icon" aria-hidden="true"><use href="#i-volume-2"/></svg>
                    <span class="btn-label" data-i18n="listen_btn"></span>
                </button>
            </div>

            <!-- Text Input -->
            <div class="dict-input-wrapper">
                <label for="dict-input" class="visually-hidden" data-i18n="dictation_input_label">Escribe lo que escuchas</label>
                <input class="field__input" type="text" id="dict-input"
                       data-lang-target
                       placeholder="Escribe lo que escuchas…"
                       autocomplete="off" spellcheck="false" autocorrect="off"
                       data-i18n-placeholder="dictation_input_ph">
                <button id="check-btn" class="btn btn--check" data-i18n="btn_verify"></button>
            </div>

            <!-- Feedback -->
            <div id="dict-feedback" class="dict-feedback hidden" role="status" aria-live="polite">
                <p class="feedback-result" id="feedback-result"></p>
                <div id="dict-diff"></div>
                <div class="feedback-divider hidden" id="alt-note-divider"></div>
                <div class="alt-note hidden" id="alt-note"></div>
            </div>

            <!-- Grammar micro-tip chip (shown on correct answer) -->
            <div id="grammar-chip-wrap" class="grammar-chip-wrap hidden">
                <a id="grammar-chip" class="grammar-chip" href="../grammar/" aria-label="Abrir Taller de Gramática para esta regla" data-i18n-aria="grammar_chip_aria">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="#i-ruler"/></svg> <span id="grammar-chip-label"></span></a>
            </div>

            <!-- Next / Try Again -->
            <div class="action-row" id="action-row">
                <button class="btn btn--next hidden" id="next-btn" aria-label="Continuar a la siguiente frase" data-i18n-aria="next_btn_aria" data-i18n="btn_next"></button>
                <button class="btn btn--retry hidden" id="try-again-btn" aria-label="Intentar esta frase de nuevo" data-i18n-aria="try_again_phrase_aria" data-i18n="btn_try_again"></button>
            </div>


        </div>

    </main>
