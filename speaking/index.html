    <script>(function(){if(typeof AppLang==='undefined')return;document.querySelectorAll('.mode-switcher .btn-label[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n'),t=AppLang.t(k);if(t!==k)e.textContent=t;});}());</script>

    <main class="speaking-page container" id="main-content">

        <!-- Topic Picker -->
        <div id="topic-picker">
            <div class="topic-picker-header">
                <h1 class="page-header__title" data-i18n-html="speaking_page_title"></h1>
                <p class="page-header__sub" data-i18n="speaking_picker_sub"></p>
            </div>

            <div class="img-topic-grid" id="topic-grid">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Exercise Area -->
        <div id="exercise-area" class="hidden">

            <!-- Session info bar -->
            <div class="session-info-bar">
                <button class="btn btn--ghost btn--sm btn--back" id="back-btn" data-i18n="back_to_topics"></button>
                <span id="session-counter" class="session-counter" role="status" aria-live="polite"></span>
                <span class="streak-badge" id="streak-badge" role="status" aria-live="polite"></span>
            </div>
            <div class="progress-bar session-progress-bar" id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la sesión" data-i18n-aria="session_progress_aria"><div class="progress-bar__fill session-progress-fill" id="session-progress-fill"></div></div>

            <h1 class="page-header__title listening-title" data-i18n-html="speaking_title"></h1>
            <p class="page-header__sub listening-subtitle" data-i18n="speaking_sub"></p>

            <!-- Phrase Card -->
            <div class="phrase-card" id="phrase-card">
                <div id="Phrase" data-lang-target></div>
                <div id="Traduction"></div>
            </div>

            <!-- Primary Actions: Listen + Speak -->
            <div class="actions-row">
                <button id="listenButton" class="btn btn--secondary" aria-label="Escuchar la frase" data-i18n-aria="listen_phrase_aria" data-i18n="listen_btn_label"></button>
 <button id="speakButton" class="btn btn--primary" aria-label="Habla la frase en voz alta" data-i18n-aria="speak_phrase_aria" data-i18n="speak_btn"> Hablar</button>
            </div>

            <!-- Text fallback (shown when STT unavailable) -->
            <div class="text-fallback hidden" id="text-fallback">
                <label for="text-input" class="visually-hidden" data-i18n="text_input_label">Escribe la frase aquí</label>
                <input class="field__input" type="text" id="text-input" placeholder="Escribe la frase aquí y presiona Enter…"
                       autocomplete="off" spellcheck="false" data-i18n-placeholder="text_input_ph">
 <button id="text-submit" class="btn btn--primary" aria-label="Enviar frase escrita" data-i18n-aria="text_submit_aria" data-i18n="btn_verify">Verificar </button>
            </div>

            <!-- Recording status -->
            <p id="recognizedText" aria-live="polite"></p>

            <!-- Feedback card (shown after evaluation) -->
            <div id="speaking-feedback" class="speaking-feedback hidden" role="status" aria-live="polite">
                <p class="feedback-result" id="speaking-feedback-result"></p>
                <div id="speaking-diff"></div>
                <div class="feedback-divider hidden" id="alt-note-divider"></div>
                <div class="alt-note hidden" id="alt-note"></div>
            </div>

            <!-- Grammar chip (shown after correct answer) -->
            <div class="post-feedback-row">
                <div id="grammar-chip-wrap" class="grammar-chip-wrap hidden">
                    <a id="grammar-chip" class="grammar-chip" href="../grammar/" aria-label="Abrir Taller de Gramática para esta regla" data-i18n-aria="grammar_chip_aria">
                        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-ruler"/></svg> <span id="grammar-chip-label"></span> →
                    </a>
                </div>
            </div>

            <!-- Secondary Actions: Try Again + Next -->
            <div class="action-row" id="action-row">
                <button id="tryAnotherButton" class="btn btn--primary hidden" disabled aria-label="Ir a la siguiente frase" data-i18n-aria="next_phrase_aria" data-i18n="btn_next"></button>
                <button id="tryAgainButton" class="btn btn--secondary hidden" disabled aria-label="Intentar hablar de nuevo" data-i18n-aria="try_again_speaking_aria" data-i18n="btn_try_again"></button>
            </div>

        </div>

    </main>
