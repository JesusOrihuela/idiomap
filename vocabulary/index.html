    <main class="container" id="main-content">

        <!-- Topic Picker (shown first) -->
        <div id="topic-picker">
            <div class="topic-picker-header page-header">
                <h1 class="page-header__title" data-i18n-html="vocab_page_title"></h1>
                <p class="page-header__sub" data-i18n="vocab_picker_sub"></p>
            </div>
            <div class="topic-grid" id="topic-grid"></div>
        </div>

        <!-- Vocab Content (hidden until topic selected) -->
        <div id="vocab-content" class="hidden">

            <!-- Stats Bar -->
            <div class="session-info-bar">
                <button class="btn btn--ghost btn--sm btn--back" id="back-btn" aria-label="Volver al selector de temas" data-i18n-aria="back_to_topics_aria" data-i18n="back_to_topics"></button>
                <span id="cards-remaining" class="session-counter" role="status" aria-live="polite"></span>
                <span class="streak-badge" id="vocab-streak"></span>
            </div>
            <div class="progress-bar session-progress-bar" id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la sesión" data-i18n-aria="session_progress_aria"><div class="progress-bar__fill session-progress-fill" id="session-progress-fill"></div></div>

            <!-- Title + instruction -->
            <h1 class="page-header__title vocab-title" data-i18n-html="vocab_ex_title"></h1>
            <p class="page-header__sub vocab-subtitle" data-i18n="vocab_ex_sub"></p>

            <!-- Flashcard -->
            <div class="flashcard-scene" id="flashcard-scene">
                <div class="flashcard" id="flashcard">

                    <!-- Front: word -->
                    <div class="flashcard-face flashcard-front" id="flashcard-front">
                        <div class="fc-front-top">
                            <span class="word-category" id="word-category"></span>
                        </div>
                        <div class="word-text" id="word-text"></div>
                        <button class="btn btn--secondary listen-btn" id="listen-btn" aria-label="Escuchar pronunciación" data-i18n-aria="listen_pronunciation_aria">
                            <svg class="icon" aria-hidden="true"><use href="#i-volume-2"/></svg>
                            <span class="btn-label" data-i18n="listen_btn_label"></span>
                        </button>
                        <button type="button" class="flip-hint" id="flip-btn" aria-controls="flashcard-back" aria-expanded="false" data-i18n="flip_hint">Ver significado</button>
                    </div>

                    <!-- Back: una columna, como el resto de ejercicios -->
                    <div class="flashcard-face flashcard-back" id="flashcard-back" aria-hidden="true" inert>
                        <div class="fc-back-head">
                            <button type="button" class="fc-back-word" id="fc-back-word" aria-label="Volver a la palabra" data-i18n-aria="flip_back_aria"></button>
                            <button class="btn btn--secondary listen-btn listen-btn-back" id="listen-btn-back" aria-label="Escuchar pronunciación" data-i18n-aria="listen_pronunciation_aria">
                                <svg class="icon" aria-hidden="true"><use href="#i-volume-2"/></svg>
                                <span class="btn-label" data-i18n="listen_btn_label"></span>
                            </button>
                        </div>
                        <div class="fc-definition-block">
                            <div class="fc-def-head">
                                <span class="fc-label" data-i18n="fc_definition_label">Definición</span>
                                <div class="fc-def-switch segmented hidden" id="fc-def-switch" role="group" aria-label="Idioma de la definición" data-i18n-aria="fc_def_switch_aria">
                                    <button class="segmented__item fc-def-side" id="fc-def-l1" type="button" aria-pressed="true" aria-label="Definición en el idioma base" data-i18n-aria="fc_def_side_aria"></button>
                                    <button class="segmented__item fc-def-side" id="fc-def-l2" type="button" aria-pressed="false" aria-label="Definición en el idioma objetivo" data-i18n-aria="fc_def_side_aria"></button>
                                </div>
                            </div>
                            <div class="word-definition" id="word-definition"></div>
                        </div>
                        <div class="fc-example-block">
                            <span class="fc-label" data-i18n="fc_example_label">Ejemplo</span>
                            <div class="word-example" id="word-example"></div>
                        </div>
                        <div class="fc-translation-block">
                            <span class="fc-label" data-i18n="fc_spanish_label">Español</span>
                            <div class="word-translation" id="word-translation"></div>
                        </div>
                        <div class="fc-variants-block hidden" id="fc-variants-block">
                            <span class="fc-label" data-i18n="fc_variants_label">Variantes</span>
                            <div class="word-variants" id="word-variants"></div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Next button: outside the card, like the rest of exercises. The
                 space is reserved so flipping does not move the card. -->
            <button class="btn btn--next" id="next-btn" aria-label="Continuar a la siguiente palabra" data-i18n-aria="next_word_aria" data-i18n="btn_next"></button>

        </div>

    </main>
