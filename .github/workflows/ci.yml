name: Content checks

# Validates content quality on every push and pull request to main.
# Runs the same audits used locally (check-content + audit) so broken
# schema, anglicisms, punctuation, ID collisions, over-long slugs, etc.
# are caught before they reach the published site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: the validators only read JSON + tool scripts, so we
      # skip the ~400 MB of audio for a fast, cheap run. shared/js is needed
      # because fix-phrase-ids.js --check reads shared/js/progress.js (the _ID_MAP);
      # shared/img/flags is needed because check-pair-completeness.mjs verifies every
      # flag code a pair declares has a real SVG asset (small — just the flag SVGs).
      - name: Checkout (pages + shared + tools)
        uses: actions/checkout@v5
        with:
          # This job also runs the CSS/LANG-attr scanners, which open every
          # page and stylesheet; audio and images stay out of the checkout.
          sparse-checkout: |
            cloze
            dictation
            grammar
            index
            lang
            my-learning
            placement
            progress
            quiz
            scramble
            shared/css
            shared/img/flags
            shared/js
            shared/json
            speaking
            tests
            tools
            translation
            vocabulary
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Both scripts use only Node built-ins — no npm install needed.
      - name: Content rule checks (check-content.mjs)
        run: node tools/check-content.mjs

      - name: No em/en dashes in user-facing text
        run: node tools/check-dashes.mjs

      # Layered language model: 18 active languages, pair manifests and generated
      # pairs.js/languages.js must be in sync with the JSON sources.
      - name: Language model (build --check + check-language-model.mjs)
        run: node tools/build-language-model.mjs --check && node tools/check-language-model.mjs

      - name: Language profiles + UI bundles in sync
        run: node tools/build-lang-profiles.mjs --check && node tools/build-ui-bundles.mjs --check

      - name: Logical CSS properties
        run: node tools/migrate-logical-css.mjs --check && node tools/check-lang-attrs.mjs

      - name: Text precision golden tests
        run: node tests/text-golden.mjs

      - name: Layered content
        run: node tools/check-layered-content.mjs

      - name: Audio references
        run: node tools/check-audio-refs.mjs

      - name: Audio duplicates + signal
        run: node tools/dedupe-audio.mjs --gate && node tools/build-audio-manifest.mjs --check && node tools/check-audio.mjs

      - name: Content audit (audit.mjs --quick)
        run: node tools/audit.mjs --quick

      # Variant framework openness: a dimension defined ONLY in the registry
      # (shared/js/variant-dimensions.js) must be valid content, badge-able, and completeness-
      # checkable with NO other code change — the guarantee that any future language can add its
      # own axis (case, number, aspect, honorific…) data-only. Registers a fictitious dimension at
      # runtime and asserts the generic machinery handles it. Fails if a consumer hardcodes dims.
      - name: Variant registry openness (variant-openness.mjs)
        run: node tools/variant-openness.mjs

      # Variant completeness: if a phrase or word offers one variant of a set it must offer ALL
      # genuine ones (region across countries/zones, both genders for a variable-gender person,
      # and their combinations) — in phrases AND vocab, driven by the open dimension registry +
      # the DAMER/DLE-sourced region lexicon. Fails on any incomplete set.
      - name: Variant completeness (check-variants.mjs --gate)
        run: node tools/check-variants.mjs --gate

      # Phrase atomicity + length: every phrase is ONE idea within its CEFR word AND character
      # limits (matters most for Dictation — pure working-memory transcription). Fails on run-ons
      # or over-limit phrases.
      - name: Phrase atomicity + length (check-length.mjs --gate)
        run: node tools/check-length.mjs --gate

      # Grammar↔phrase evidence: (a) every rule's `topics` must equal the topics
      # whose phrases exercise the structure, and (b) grammar-phrase-rules.json (the
      # per-phrase rule map that drives the learning-mode grammar chip) must match
      # the detectors. Both are re-derived from phrase evidence; fails on any drift
      # (run grammar-topics.mjs --write to regenerate both).
      - name: Grammar topics + phrase-rule map reflect evidence (grammar-topics.mjs --check)
        run: node tools/grammar-topics.mjs --check

      # Grammar rule completeness & comprehension: every rule must populate all five
      # Focus-on-Form phases (context/notice/rule/structured/production) and every
      # learner-facing target sentence (dialogue turn, structured-input, quiz) must
      # carry a source-language `translation` — so grammar is never a wall of text nor
      # an opaque sentence in a distant target. Spec: docs/GRAMMAR.md.
      - name: Grammar rules complete + glossed (check-grammar.mjs)
        run: node tools/check-grammar.mjs

      # Mi Aprendizaje path completeness: _ID_MAP in progress.js (the topic→phraseIds /
      # vocabIds lookup the path session builder reads) must match the content. Derived
      # from topics.json + the vocab files, so a new category/phrase/word flows in
      # automatically — this fails the build if progress.js was not regenerated, which
      # would otherwise silently drop that content from every learner's path.
      - name: Path ID map reflects content (fix-phrase-ids.js --check)
        run: node tools/fix-phrase-ids.js --check

      # Every target language a pair learns must have a COMPLETE linguistic profile
      # (shared/js/lang-profiles.js + tools/lang-detectors.mjs): accent-fold rule,
      # cloze stop-words, function words, grammar detectors, and tip→rule labels
      # whose rule ids exist. Turns "add a language" into "fill one profile or fail".
      - name: Language profiles complete (check-lang-profiles.mjs)
        run: node tools/check-lang-profiles.mjs

      # Per-pair RUNTIME completeness: every pair's declared flags have SVG assets, every grammar
      # rule's category is defined (else an empty Grammar grid), and placement exists. Catches the
      # class of gaps the first divergent pair (en-de) exposed by hand, before a user sees them.
      - name: Pair completeness (check-pair-completeness.mjs)
        run: node tools/check-pair-completeness.mjs

      # Category taxonomy (shared/json/common/category-scopes.json) is the single
      # source of truth for every category's scope; it must stay in sync with the
      # actual content (no orphan scopes, no unscoped category) and every phrase id
      # must respect its topic prefix. Anchors the semantic content-quality audit.
      # Design tokens: tokens/*.tokens.json (DTCG 2025.10) is the single source;
      # shared/css/tokens.css is generated. Fails if the CSS was edited by hand or
      # the JSON no longer produces it.
      - name: Design tokens in sync + contrast contract
        run: node tools/build-tokens.mjs --check && node tools/check-tokens.mjs

      # UI system gate (check-ui-system.mjs)
      - name: UI system gate (check-ui-system.mjs)
        run: node tools/check-ui-system.mjs

      # Component standardization: no page-level overrides of canonical components,
      # a single base rule per component, required states, no unstyled classes,
      # no !important outside utilities/reduced-motion.
      - name: Component gate (check-components.mjs)
        run: node tools/check-components.mjs

      # Flags: real imported assets (no SVG drawn in JS), aspect ratio = FLAG_AR,
      # no orphan files, every referenced code has its asset.
      - name: Flag gate (check-flags.mjs)
        run: node tools/check-flags.mjs

      # Links: internal hrefs resolve, no href="#" or javascript:, active nav has
      # aria-current, target=_blank has rel + new-tab disclosure, icon-only links named.
      - name: Link gate (check-links.mjs)
        run: node tools/check-links.mjs

      # Origin/canonical/sitemap/robots/manifest come from site.json (single source).
      - name: Site metadata (site.json)
        run: node tools/build-site-meta.mjs --check

      # Nav bar is generated from shared/json/nav.json (no drift across pages).
      - name: Nav (shared/json/nav.json)
        run: node tools/build-nav.mjs --check

      - name: Category taxonomy conforms (check-taxonomy.mjs)
        run: node tools/check-taxonomy.mjs

  # Topic-card images: every (activity, topic) slot must have both jpg (1280×720)
  # and webp (800×450), correctly framed (no letterbox/pillarbox bar), sharp, unique
  # within an activity, present, and free of orphans. Verified by check-images.mjs +
  # img-probe.py (Pillow+numpy). Keeps the image set from silently regressing (wrong
  # dims, missing, duplicate, or bordered pictures). Relevance is audited separately
  # (audit-images.mjs, CLIP) — dev-time and advisory, so not part of the CI gate.
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (images + JS + tools)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            cloze/img
            dictation/img
            quiz/img
            scramble/img
            speaking/img
            translation/img
            vocabulary/img
            shared/img
            shared/js
            shared/json
            tools
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow + numpy
        run: pip install --quiet pillow numpy
      - name: Topic images valid (check-images.mjs)
        run: node tools/check-images.mjs
      # Variant assets: every region/variant label used in content must have its real SVG (country
      # flag, flag cluster, or macro-zone globe) — no label silently falls back to bare text.
      - name: Variant assets present (check-assets.mjs)
        run: node tools/check-assets.mjs --gate

  # i18n standard: no hardcoded UI text in HTML — every translatable element is
  # empty with a data-i18n* attribute, filled from lang/ui.js by AppI18nDom. This
  # job fails if any page hardcodes text or uses a key missing from a language block.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (HTML + lang + tools)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            lang
            tools
            shared/json/pairs/es-en
            speaking/html
            dictation/html
            cloze/html
            translation/html
            scramble/html
            vocabulary/html
            quiz/html
            grammar/html
            my-learning/html
            progress/html
            placement/html
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: No hardcoded UI text + keys resolve (check-i18n.mjs)
        run: node tools/check-i18n.mjs

      # Accessibility gate: <html lang>, img alt, accessible names on controls/inputs,
      # no duplicate ids. Deterministic; complements the broad Lighthouse a11y audit.
      - name: Accessibility checks (check-a11y.mjs)
        run: node tools/check-a11y.mjs

  # Core-vocabulary rule (TWO CHANNELS): every target language must teach ≥ its floor of
  # the top-1000 core with PHRASES alone AND with VOCAB alone — the core taught both in
  # context (phrases) and in isolation (vocab). Runs for EVERY language (derived from the
  # pairs), each against a COMMITTED frequency index (frequency.gateIndex in lang-profiles:
  # NGSL for en, a lemmatized FrequencyWords core for es) with a per-language floor
  # (frequency.gateFloor). No "local only" per language: a language without a committed
  # index fails the gate. (Spanish's CEFR-graded ELELex is CC BY-NC-SA → local-only
  # reference, never the gate.) Floors are ratcheting regression guards kept a couple
  # points below live coverage, not comparable across languages (different yardsticks).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (JSON + JS + tools)
        uses: actions/checkout@v5
        with:
          # shared/js is needed because coverage.mjs imports the language-profile
          # registry (shared/js/lang-profiles.js) for function-word / ignore sets.
          sparse-checkout: |
            shared/json
            shared/js
            tools
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Gates ALL languages, each against its committed index at its per-language floor
      # (lang-profiles frequency.gateFloor). No --pair / --min → derives the pairs and
      # reads each floor from the profile.
      - name: Core-vocabulary coverage floor (every language, top-1000 in BOTH channels)
        run: node tools/coverage.mjs --gate

  # Browser smoke suite (tests/smoke.mjs): runs the app in headless Chromium and
  # checks the things static checks can't — the answer loop, feedback rendering,
  # the Enter-key regression, and that every page loads with no uncaught JS errors
  # (it already caught a missing script include on the placement page). Serves the
  # app itself (no audio needed), so it checks out everything except shared/audio.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (app, no audio)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            index
            lang
            shared/js
            shared/css
            shared/json
            cloze
            dictation
            translation
            scramble
            vocabulary
            quiz
            grammar
            speaking
            my-learning
            progress
            placement
            tests
            tools
          sparse-checkout-cone-mode: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install deps (playwright-core)
        run: npm ci
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - name: Browser smoke suite
        run: npm test
        env:
          PW_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PW_CHANNEL: chrome   # fallback if the action's path output is empty
      - name: Phrase index contract (chip, variants, hover)
        run: npm run test:index
        env:
          PW_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PW_CHANNEL: chrome
      - name: Hardware states (permissions, audio error, completed session)
        run: npm run test:states
        env:
          PW_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PW_CHANNEL: chrome
