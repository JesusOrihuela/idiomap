name: Audio checks

# Deterministic audio-content gate: every AAC/M4A decodes, a sampled subset is not
# silent/clipped, durations are sane, and each slug carries exactly the voice set its
# language declares (tools/check-audio.mjs). Gated on paths so the heavy shared/audio
# checkout only runs when audio, content, the language voice sets, or the checker change.

on:
  push:
    branches: [main]
    paths:
      - 'shared/audio/**'
      - 'shared/json/**'
      - 'shared/js/lang-profiles.js'
      - 'tools/check-audio.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'shared/audio/**'
      - 'shared/json/**'
      - 'shared/js/lang-profiles.js'
      - 'tools/check-audio.mjs'

permissions:
  contents: read

concurrency:
  group: audio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (audio + JS + tools)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            shared/audio
            shared/js
            tools
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install ffmpeg (AAC probe/decode)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # ffprobe/ffmpeg for AAC; WAV is still parsed directly during the migration window.
      - name: Audio signal + voice-set valid (check-audio.mjs)
        run: node tools/check-audio.mjs
