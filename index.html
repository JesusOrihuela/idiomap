    <!-- Load the font stylesheet without blocking render: fetch it early (preload),
         apply it as print (non-blocking) then switch to all on load. FCP/LCP no
         longer wait on the font request. display=optional means the browser uses
         the fallback and does NOT swap if Raleway isn't ready immediately, so the
         async load causes no layout shift (CLS). Raleway shows once cached (repeat
         visits). <noscript> keeps it working without JS. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&display=optional">

    <!-- i18n cloak: the landing carries no hardcoded UI text - every element is
         empty (data-i18n) and filled by _initMainPageI18n() at end of body, for
         ALL pairs. Hide the page until it's filled so no empty content is painted;
         reveal on DOMContentLoaded (after that runs), with a 2 s failsafe.
         layout.css (loaded above) defines html.lang-cloak body{visibility:hidden}. -->
    <script>
    (function () {
      try {
        var de = document.documentElement;
        de.classList.add('lang-cloak');
        var reveal = function () { de.classList.remove('lang-cloak'); };
        document.addEventListener('DOMContentLoaded', reveal);
        setTimeout(reveal, 2000);
      } catch (e) {}
    })();
    </script>

    <script>
      /* -- Pair Selection + Onboarding Modal + Embedded Placement Quiz -- */
      (function () {

        // -- Group 0: Show pair picker on very first visit -------------
        if (!localStorage.getItem('pe_active_pair')) {
          _initMainPageI18n(); // translate background using navigator.language
          _showPairPicker();
          return;
        }

        // -- Translate main page content for English-source pairs ------
        _initMainPageI18n();

        // -- Background model preload --------------------------------
        // Start caching TTS + STT models as soon as the pair is confirmed.
        // Guards on localStorage keys set by AppDownloadPanel.complete() - no
        // Worker is created on repeat visits when models are already cached.
        if (typeof AppTTS !== 'undefined' && !localStorage.getItem('pe_tts_cached')) {
          AppTTS.warmup();
        }
        function _startSttWarmup() {
          try {
            var _sttDp = (typeof AppDownloadPanel !== 'undefined' && typeof AppLang !== 'undefined')
              ? AppDownloadPanel.create(AppLang.t('stt_loading'), AppLang.t('stt_ready'), 'pe_stt_cached')
              : null;
            var _sttWu = new Worker('shared/js/stt-worker.js', { type: 'module' });
            _sttWu.onmessage = function (e) {
              if (!e.data) return;
              if (e.data.type === 'progress' && e.data.progress != null && _sttDp) _sttDp.update(e.data.progress);
              if (e.data.type === 'ready') {
                if (_sttDp) _sttDp.complete(); else localStorage.setItem('pe_stt_cached', '1');
                _sttWu.terminate();
              }
            };
            _sttWu.onerror = function () { if (_sttDp) _sttDp.hide(); _sttWu.terminate(); };
          } catch (e) {}
        }
        // Validate Cache API before trusting the localStorage flag: if
        // transformers-cache was evicted, clear the stale flag so the
        // download panel shows on the next warmup.
        function _maybeStartSttWarmup() {
          if ('caches' in window) {
            caches.open('transformers-cache')
              .then(function (c) { return c.keys(); })
              .then(function (keys) {
                if (keys.length === 0) localStorage.removeItem('pe_stt_cached');
                if (!localStorage.getItem('pe_stt_cached')) _startSttWarmup();
              })
              .catch(function () {
                if (!localStorage.getItem('pe_stt_cached')) _startSttWarmup();
              });
          } else {
            if (!localStorage.getItem('pe_stt_cached')) _startSttWarmup();
          }
        }
        // Defer the ~41 MB STT model preload until the page is interactive so it
        // does not compete with first paint / LCP during the critical load window.
        // The model still warms up in the background - just after the page is usable.
        if ('requestIdleCallback' in window) {
          requestIdleCallback(_maybeStartSttWarmup, { timeout: 4000 });
        } else {
          window.addEventListener('load', function () { setTimeout(_maybeStartSttWarmup, 1500); });
        }

        if (localStorage.getItem(AppLangPair.storageKey('pe_onboarded'))) return;

        // -- Placement questions - the ACTIVE PAIR's own placement.json --
        // Every pair ships one (shared/json/pairs/<pair>/placement.json), already in the source
        // language, so the onboarding quiz auto-adapts to any pair with NO per-pair key to maintain.
        var QUESTIONS = null;
        fetch('shared/json/pairs/' + AppLangPair.getActive().id + '/placement.json')
          .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function(data) { QUESTIONS = data.questions || []; })
          .catch(function() { QUESTIONS = []; });

        var overlay = document.getElementById('ob-overlay');
        var quizIdx = 0, quizScore = 0, quizAnswered = false;

        function show() {
          var step0Title = document.querySelector('#ob-step-0 .ob-title');
          var step0Body  = document.querySelector('#ob-step-0 .ob-body');
          var step0Btn   = document.getElementById('ob-next-0');
          if (step0Title) step0Title.textContent = AppLang.t('ob_title_how', { target: AppLangPair.getActive().target.localName, targetName: AppLangPair.getActive().target.name });
          if (step0Body)  step0Body.innerHTML    = AppLang.t('ob_body_how');
          if (step0Btn)   step0Btn.textContent   = AppLang.t('ob_btn_find_level');
          var step1Title = document.querySelector('#ob-step-1 .ob-title');
          var step1Body  = document.querySelector('#ob-step-1 .ob-body');
          var step1Btn   = document.getElementById('ob-topics-done');
          if (step1Title) step1Title.textContent = AppLang.t('ob_title_topics');
          if (step1Body)  step1Body.textContent  = AppLang.t('ob_body_topics');
          if (step1Btn)   step1Btn.textContent   = AppLang.t('ob_btn_topics_done');
          var skipBtn = document.getElementById('ob-quiz-skip');
          if (skipBtn) skipBtn.textContent = AppLang.t('ob_quiz_skip');
          var manualLabel = document.querySelector('.ob-quiz-manual-label');
          if (manualLabel) manualLabel.textContent = AppLang.t('ob_manual_label');
          // Manual level buttons
          document.querySelectorAll('.ob-manual-btn').forEach(function(btn) {
            var lvl = btn.getAttribute('data-level');
            var _LEVEL_KEYS = { A1: 'manual_level_beginner', B1: 'manual_level_intermediate', C1: 'manual_level_advanced' };
            if (_LEVEL_KEYS[lvl]) btn.innerHTML = AppLang.t(_LEVEL_KEYS[lvl]);
          });
          var step3Title = document.querySelector('#ob-step-3 .ob-title');
          var goPathBtn  = document.getElementById('ob-go-path');
          var goFreeBtn  = document.getElementById('ob-go-free');
          if (step3Title) step3Title.textContent = AppLang.t('ob_title_done');
          if (goPathBtn)  goPathBtn.textContent  = AppLang.t('ob_btn_go_path');
          if (goFreeBtn)  goFreeBtn.textContent  = AppLang.t('ob_btn_explore');
          overlay.classList.remove('hidden');
          goStep(0);
        }

        function syncActions(n) {
          var actions = document.getElementById('ob-actions');
          if (!actions) return;
          actions.hidden = n === 2;
          document.getElementById('ob-next-0').hidden = n !== 0;
          document.getElementById('ob-topics-done').hidden = n !== 1;
          document.getElementById('ob-go-path').hidden = n !== 3;
          document.getElementById('ob-go-free').hidden = n !== 3;
        }

        function dismiss() {
          localStorage.setItem(AppLangPair.storageKey('pe_onboarded'), '1');
          if (typeof AppProficiency !== 'undefined') AppProficiency.initDefault();
          overlay.classList.add('ob-out');
          setTimeout(function () { overlay.classList.add('hidden'); }, 280);
        }

        function goStep(n) {
          document.querySelectorAll('.ob-step').forEach(function (el) { el.classList.add('hidden'); });
          document.getElementById('ob-step-' + n).classList.remove('hidden');
          var labels = ['ob-title', 'ob-title-1', 'ob-quiz-q', 'ob-title-3'];
          overlay.setAttribute('aria-labelledby', labels[n] || 'ob-title');
          document.querySelectorAll('.ob-progress__seg').forEach(function (seg, i) {
            seg.classList.toggle('is-on', i <= n + 1);
          });
          var count = document.getElementById('ob-step-count');
          if (count) count.textContent = (n + 2) + ' / 5';
          syncActions(n);
          setTimeout(function () {
            if (n === 2) {
              var opt = document.querySelector('#ob-quiz-opts .ob-opt-btn');
              if (opt) opt.focus();
              return;
            }
            var id = n === 1 ? 'ob-title-1' : n === 3 ? 'ob-title-3' : 'ob-title';
            var target = document.getElementById(id);
            if (target) target.focus();
          }, 0);
        }

        // Score ? CEFR, proportional to the question count (pairs differ: 14 vs 6), so the same
        // band ratios apply whatever the pair's placement length is.
        function scoreToLevel(s, total) {
          var pct = total > 0 ? s / total : 0;
          if (pct <= 3 / 14)  return 'A1';
          if (pct <= 6 / 14)  return 'A2';
          if (pct <= 9 / 14)  return 'B1';
          if (pct <= 11 / 14) return 'B2';
          if (pct <= 13 / 14) return 'C1';
          return 'C2';
        }

        var _isEnSrc = AppLangPair.getActive().source.code === 'en';
        // Level label localized to the source language (any pair), not a hardcoded en/es dict.
        function _levelLabel(level) {
          var t = AppLang.t('placement_result_' + level.toLowerCase() + '_label');
          return (t && t.indexOf('placement_result_') !== 0) ? t : level;
        }

        function _finishPlacement(level) {
          localStorage.setItem(AppLangPair.storageKey('pe_placement_done'), 'done');
          localStorage.setItem(AppLangPair.storageKey('pe_placement_level'), level);
          if (typeof AppProficiency !== 'undefined') AppProficiency.initFromManual(level);
          var msg = document.getElementById('ob-welcome-msg');
          if (msg) {
            msg.textContent = AppLang.t('ob_welcome_msg', { level: _levelLabel(level) });
          }
          goStep(3);
        }

        function showQuestion(i) {
          var q = QUESTIONS[i];
          var pct = (i / QUESTIONS.length) * 100;
          document.getElementById('ob-quiz-fill').style.transform = 'scaleX(' + (pct / 100) + ')';
          document.getElementById('ob-quiz-bar').setAttribute('aria-valuenow', Math.round(pct));
          document.getElementById('ob-quiz-counter').textContent = AppLang.t('placement_counter', { n: i + 1, total: QUESTIONS.length });
          document.getElementById('ob-quiz-lvbadge').textContent = q.level;
          document.getElementById('ob-quiz-q').textContent = q.q;
          var optsEl = document.getElementById('ob-quiz-opts');
          optsEl.innerHTML = '';
          quizAnswered = false;
          q.options.forEach(function (opt, idx) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'ob-opt-btn';
            var letter = document.createElement('span');
            letter.className = 'ob-opt-idx';
            letter.setAttribute('aria-hidden', 'true');
            letter.textContent = String.fromCharCode(65 + idx);
            btn.appendChild(letter);
            btn.appendChild(document.createTextNode(opt));
            btn.addEventListener('click', function () { selectOption(idx); });
            optsEl.appendChild(btn);
          });
        }

        function selectOption(idx) {
          if (quizAnswered) return;
          quizAnswered = true;
          var q = QUESTIONS[quizIdx];
          var correct = idx === q.answer;
          if (correct) quizScore++;
          if (typeof AppProficiency !== 'undefined') AppProficiency.update(q.level, correct, 'quiz', true);
          document.querySelectorAll('.ob-opt-btn').forEach(function (b, i) {
            b.disabled = true;
            if (i === q.answer) b.classList.add('ob-opt-btn--correct');
            if (i === idx && !correct) b.classList.add('ob-opt-btn--wrong');
          });
          setTimeout(function () {
            quizIdx++;
            if (quizIdx < QUESTIONS.length) {
              showQuestion(quizIdx);
            } else {
              document.getElementById('ob-quiz-fill').style.transform = 'scaleX(1)';
              _finishPlacement(scoreToLevel(quizScore, QUESTIONS.length));
            }
          }, 850);
        }

        document.getElementById('ob-close').addEventListener('click', dismiss);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) dismiss(); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !overlay.classList.contains('hidden')) dismiss();
        });

        document.getElementById('ob-next-0').addEventListener('click', function () {
          renderTopicBubbles();
          goStep(1);
        });

        function renderTopicBubbles() {
          var container = document.getElementById('ob-topic-bubbles');
          if (container.children.length) return;
          var saved = new Set();
          try {
            saved = new Set(JSON.parse(localStorage.getItem(AppLangPair.storageKey('pe_topic_preferences')) || '[]'));
          } catch (e) { /* preferencias ilegibles: empieza sin seleccion */ }
          (typeof AppTopics !== 'undefined' ? AppTopics.PHRASE_TOPICS : []).forEach(function (t) {
            var btn = document.createElement('button');
            var isOn = saved.has(t.id);
            btn.className = 'prog-bubble' + (isOn ? ' prog-bubble--on' : '');
            btn.type = 'button';
            var _label = (typeof AppTopics !== 'undefined' && AppTopics.getLabel)
              ? AppTopics.getLabel(t)
              : ((_isEnSrc && t.labelEn) ? t.labelEn : t.label);
            var icon = document.createElement('span');
            icon.className = 'prog-bubble-icon';
            icon.setAttribute('aria-hidden', 'true');
            icon.innerHTML = '<svg class="icon"><use href="#' + AppTopicIcon.of(t.id) + '"/></svg>';
            var text = document.createElement('span');
            text.className = 'prog-bubble-label';
            text.textContent = _label;
            btn.replaceChildren(icon, text);
            btn.dataset.id = t.id;
            btn.setAttribute('aria-pressed', isOn ? 'true' : 'false');
            btn.addEventListener('click', function () {
              var on = btn.classList.toggle('prog-bubble--on');
              btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            container.appendChild(btn);
          });
          var search = document.getElementById('ob-topic-search');
          if (search && !search.dataset.bound) {
            search.dataset.bound = '1';
            search.addEventListener('input', function () {
              var q = search.value.trim().toLowerCase();
              Array.from(container.children).forEach(function (b) {
                b.hidden = q !== '' && b.textContent.toLowerCase().indexOf(q) === -1;
              });
            });
          }
        }

        document.getElementById('ob-topics-done').addEventListener('click', function () {
          var on = Array.from(document.querySelectorAll('#ob-topic-bubbles .prog-bubble--on'))
                       .map(function (b) { return b.dataset.id; });
          localStorage.setItem(AppLangPair.storageKey('pe_topic_preferences'), JSON.stringify(on));
          quizIdx = 0; quizScore = 0;
          showQuestion(0);
          goStep(2);
        });

        document.getElementById('ob-quiz-skip').addEventListener('click', function () {
          ['ob-quiz-meta', 'ob-quiz-bar', 'ob-quiz-q', 'ob-quiz-opts', 'ob-quiz-skip'].forEach(function (id) {
            document.getElementById(id).classList.add('hidden');
          });
          document.getElementById('ob-quiz-manual').classList.remove('hidden');
        });

        document.querySelectorAll('.ob-manual-btn').forEach(function (btn) {
          btn.addEventListener('click', function () { _finishPlacement(btn.dataset.level); });
        });

        document.getElementById('ob-go-path').addEventListener('click', function () {
          dismiss();
          window.location.href = 'my-learning/';
        });
        document.getElementById('ob-go-free').addEventListener('click', dismiss);

        setTimeout(show, 700);

        // -- Main page i18n (translates static HTML for non-es source) --
        function _initMainPageI18n() {
          if (typeof AppI18nDom === 'undefined') return;
          // Activity count = the feature cards actually rendered (8 today). The
          // learning path is NOT an exercise and is deliberately excluded.
          var _count = document.querySelectorAll('.feature-card-link').length;
          var _an = document.getElementById('stat-activities-num');
          if (_an && _count) _an.textContent = String(_count);
          // CEFR range actually covered by the active pair (from pairs.js, built
          // from gloss.json). Stress pilots show their real single level.
          var _ln = document.getElementById('stat-levels-num');
          if (_ln && typeof AppLangPair !== 'undefined') {
            var _lv = AppLangPair.getActive().levels;
            if (_lv && _lv.min) _ln.textContent = _lv.min === _lv.max ? _lv.min : _lv.min + '-' + _lv.max;
          }
          // Fill every data-i18n* element (landing + onboarding) from AppLang,
          // for ALL pairs - no hardcoded UI text in the HTML (project standard).
          var _params = AppI18nDom.params();
          _params.count = _count;
          AppI18nDom.apply(document, _params);

          // Hero "Phrases" stat = the REAL number of phrases the active pair has (from the ID map),
          // not a hardcoded figure - so each pair shows its own size. Floor to a round number with a
          // "+" for large decks (honest: "at least N"); exact for small stress-test pairs.
          // progress.js loads later in the body, so run once it's available (DOMContentLoaded).
          var _setPhrasesStat = function () {
            try {
              var _pn = document.getElementById('stat-phrases-num');
              if (!_pn || typeof Progress === 'undefined' || !Progress.getContentCounts) return;
              // The count comes from the id-map, now fetched lazily (off the critical path).
              // Wait for it, then fill; the " … " placeholder has a reserved width (index.css)
              // so this late text swap causes no layout shift (CLS stays 0).
              var _apply = function () {
                var _ph = Progress.getContentCounts().phrases;
                if (_ph > 0) _pn.textContent = _ph >= 100 ? (Math.floor(_ph / 100) * 100) + '+' : String(_ph);
              };
              if (Progress.ensureIdMap) Progress.ensureIdMap().then(_apply); else _apply();
            } catch (e) { /* stat stays as the placeholder */ }
          };
          if (typeof Progress !== 'undefined') _setPhrasesStat();
          else document.addEventListener('DOMContentLoaded', _setPhrasesStat);

          // Footer: invariant name + translatable "developed by" + dynamic year.
          var fp = document.querySelector('footer .footer-content p');
          if (fp && typeof AppLang !== 'undefined') {
            var dev = AppLang.t('footer_developed_by');
            if (dev !== 'footer_developed_by') {
              fp.innerHTML = '© <span id="footer-year">' + new Date().getFullYear() + '</span> ' + dev + ' aurariola<span style="color:var(--color-action)">.</span>com';
            }
          }
        }

        // -- Pair picker (shown when pe_active_pair === null) ----------
        function _showPairPicker() {
          var _PICKER_UI = {
            en: { title: 'What language do you want to learn?',       subtitle: 'Choose your learning path'            },
            es: { title: '¿Qué idioma quieres aprender?',             subtitle: 'Elige tu ruta de aprendizaje'         },
            fr: { title: 'Quelle langue veux-tu apprendre ?',         subtitle: 'Choisis ton parcours d\'apprentissage' },
            pt: { title: 'Qual idioma você quer aprender?',           subtitle: 'Escolha seu caminho de aprendizagem'  },
            de: { title: 'Welche Sprache möchtest du lernen?',        subtitle: 'Wähle deinen Lernpfad'                },
            it: { title: 'Quale lingua vuoi imparare?',               subtitle: 'Scegli il tuo percorso'               },
            nl: { title: 'Welke taal wil je leren?',                  subtitle: 'Kies je leertraject'                  },
            pl: { title: 'Jakiego jezyka chcesz sie nauczyc?',        subtitle: 'Wybierz swoja sciezke nauki'          },
            cs: { title: 'Jaký jazyk se chceš naučit?',              subtitle: 'Zvol si svou vzdělávací cestu'         },
            sv: { title: 'Vilket språk vill du lära dig?',            subtitle: 'Välj din inlärningsväg'               },
            da: { title: 'Hvilket sprog vil du lære?',                subtitle: 'Vælg din læringssti'                  },
            no: { title: 'Hvilket språk vil du lære?',                subtitle: 'Velg din læringsvei'                  },
            fi: { title: 'Minkä kielen haluat oppia?',                subtitle: 'Valitse oppimispolkusi'               },
            lv: { title: 'Kadu valodu tu gribi macities?',             subtitle: 'Izvelies savu macibu celu'             },
            lt: { title: 'Kokios kalbos nori išmokti?',                subtitle: 'Pasirink savo mokymosi kelią'          },
            et: { title: 'Millist keelt soovid õppida?',               subtitle: 'Vali oma õpitee'                       },
          };
          var _navCode = (navigator.language || 'en').toLowerCase().split('-')[0];
          var _lang  = _PICKER_UI[_navCode] ? _navCode : 'en';
          var _s     = _PICKER_UI[_lang];
          var _pairs = AppLangPair.getShippable();
          // El par que se previsualiza y los del idioma base del navegador van
          // primero; el resto conserva su orden.
          var _activeId = AppLangPair.getActive().id;
          _pairs.sort(function (a, b) {
            if (a.id === _activeId) return -1;
            if (b.id === _activeId) return 1;
            var am = a.source.code === _navCode ? 0 : 1;
            var bm = b.source.code === _navCode ? 0 : 1;
            return am - bm;
          });

          var picker = document.createElement('div');
          picker.id  = 'lp-picker';
          picker.className = 'lp-overlay';
          picker.setAttribute('role', 'dialog');
          picker.setAttribute('aria-modal', 'true');
          picker.setAttribute('aria-labelledby', 'lp-title');

          function _icon(name, cls) {
            var NS = 'http://www.w3.org/2000/svg';
            var svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('class', 'icon' + (cls ? ' ' + cls : ''));
            svg.setAttribute('aria-hidden', 'true');
            var use = document.createElementNS(NS, 'use');
            use.setAttribute('href', '#i-' + name);
            svg.appendChild(use);
            return svg;
          }

          var _FLAG_PREF = {
            es: 'es', en: 'gb', de: 'de', pl: 'pl', fi: 'fi', no: 'no',
            sv: 'se', pt: 'pt', it: 'it', fr: 'fr', nl: 'nl',
            cs: 'cz', da: 'dk', et: 'ee', lv: 'lv', lt: 'lt'
          };

          function _langItem(lang, target) {
            var wrap = document.createElement('span');
            wrap.className = 'lp-pair__lang' + (target ? ' lp-pair__lang--target' : '');
            var flag = _FLAG_PREF[lang.code];
            if (!flag) {
              var list = lang.flags || [];
              flag = list.length ? list[list.length - 1] : '';
            }
            if (flag && typeof AppFlags !== 'undefined') {
              try {
                var img = AppFlags.flagImg(flag);
                img.className = 'lp-flag';
                wrap.appendChild(img);
              } catch (e) { /* sin bandera */ }
            }
            var name = document.createElement('span');
            name.className = 'lp-pair__name';
            name.textContent = lang.name;
            wrap.appendChild(name);
            return wrap;
          }

          var modal = document.createElement('div');
          modal.className = 'ob-modal lp-modal';

          var progress = document.createElement('div');
          progress.className = 'ob-progress';
          progress.setAttribute('aria-hidden', 'true');
          for (var i = 0; i < 5; i++) {
            var seg = document.createElement('span');
            seg.className = 'ob-progress__seg' + (i === 0 ? ' is-on' : '');
            progress.appendChild(seg);
          }
          modal.appendChild(progress);

          var close = document.createElement('button');
          close.type = 'button';
          close.className = 'icon-btn ob-close';
          close.id = 'lp-close';
          var _closeLabel = (typeof AppLang !== 'undefined') ? AppLang.t('ob_close_aria') : '';
          if (!_closeLabel || _closeLabel === 'ob_close_aria') _closeLabel = 'Close';
          close.setAttribute('aria-label', _closeLabel);
          close.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>';
          close.addEventListener('click', function () {
            // Cerrar = usar el par previsualizado y saltar la introduccion.
            AppLangPair.setActive(AppLangPair.getActive().id);
            if (typeof AppProficiency !== 'undefined') AppProficiency.initDefault();
            localStorage.setItem(AppLangPair.storageKey('pe_onboarded'), '1');
            location.reload();
          });
          modal.appendChild(close);

          var inner = document.createElement('div');
          inner.className = 'ob-inner';

          var step = document.createElement('div');
          step.className = 'ob-step';

          var count = document.createElement('p');
          count.className = 'ob-step-count';
          count.textContent = '1 / 5';
          step.appendChild(count);

          var mark = document.createElement('div');
          mark.className = 'ob-mark';
          mark.innerHTML = '<svg class="icon icon--xl" aria-hidden="true"><use href="#i-compass"/></svg>';
          step.appendChild(mark);

          var title = document.createElement('h2');
          title.className = 'ob-title';
          title.id = 'lp-title';
          title.tabIndex = -1;
          title.textContent = _s.title;
          step.appendChild(title);

          var sub = document.createElement('p');
          sub.className = 'ob-body';
          sub.textContent = _s.subtitle;
          step.appendChild(sub);

          var cards = document.createElement('div');
          cards.className = 'lp-grid';

          _pairs.forEach(function (pair) {
            var card = document.createElement('button');
            card.type = 'button';
            card.className = 'lp-pair';
            card.setAttribute('aria-label', pair.label);

            var row = document.createElement('span');
            row.className = 'lp-pair__row';
            row.appendChild(_langItem(pair.source, false));

            var arrow = document.createElement('span');
            arrow.className = 'lp-pair__sep';
            arrow.setAttribute('aria-hidden', 'true');
            arrow.textContent = '→';
            row.appendChild(arrow);

            row.appendChild(_langItem(pair.target, true));
            card.appendChild(row);
            card.appendChild(_icon('chevron-right', 'lp-pair__chevron'));

            card.addEventListener('click', function () {
              AppLangPair.setActive(pair.id);
              location.reload();
            });

            cards.appendChild(card);
          });

          step.appendChild(cards);
          inner.appendChild(step);
          modal.appendChild(inner);
          picker.appendChild(modal);
          document.body.appendChild(picker);

          // Diálogo modal de verdad: la página de detrás queda inerte, así Tab no se
          // escapa del selector (WCAG 2.4.3). Al elegir par se recarga y se restaura.
          [].forEach.call(document.body.children, function (el) {
            if (el !== picker && 'inert' in el) el.inert = true;
          });

          setTimeout(function () { title.focus(); }, 50);
        }
      })();
    </script>
    <!-- These landing scripts are NOT needed by the head inline IIFE at parse time
         (it uses only head globals + guards, and defers its Progress-dependent stat to
         DOMContentLoaded). `defer` lets all 10 download in PARALLEL instead of the parser
         stopping to fetch each one sequentially - the big win on Slow 4G. They still run
         in document order before DOMContentLoaded (which reveals the cloak), so the path
         preview, theme and stat are all filled before first paint. -->
    <script defer src="shared/js/progress.js?v=bcc55825"></script>
    <script defer src="shared/js/content.js?v=a9ebe9f2"></script>
    <script defer src="shared/js/topic-data.js?v=5bf39a02"></script>
    <script defer src="shared/js/topics.js?v=8f5c9dae"></script>
    <script defer src="shared/js/path.js?v=41eb41ed"></script>
    <script defer src="shared/js/path-session.js?v=f54a2937"></script>
    <script defer src="shared/js/milestones.js?v=f3a74ec2"></script>
    <script defer src="shared/js/notifications.js?v=e0d3b795"></script>
    <script defer src="index/js/index.js?v=9d2a34df"></script>
    <script defer src="shared/js/network-status.js?v=bb7c0f56"></script>
    <script defer src="shared/js/theme.js?v=80cf2218"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // Automatic updates - mirrors shared/js/sw-register.js (root path here).
        // Only reload on a real update (a controller already existed), never on
        // first install. updateViaCache:'none' detects a new SW on the next
        // navigation instead of up to 24h later.
        const _hadController = !!navigator.serviceWorker.controller;
        let _refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!_hadController || _refreshing) return;
          _refreshing = true;
          location.reload();
        });
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
          .then(reg => {
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'activated' && _hadController && !_refreshing) {
                  _refreshing = true;
                  location.reload();
                }
              });
            });
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update().catch(() => {});
            });
          })
          .catch(() => {});
        // Fire daily reminder if conditions are met (once per day, after configured time).
        // notifications.js is now deferred, so wait for it (DOMContentLoaded runs after
        // all deferred scripts) before calling in - the guard alone would skip it at parse.
        document.addEventListener('DOMContentLoaded', function () {
          if (window.NotificationSystem) window.NotificationSystem.checkAndNotify();
        });
      }
    </script>
