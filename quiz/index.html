    <main class="quiz-page container" id="main-content">

        <!-- Topic Picker (shown first) -->
        <div id="topic-picker">
            <div class="topic-picker-header page-header">
                <h1 class="page-header__title" data-i18n-html="quiz_page_title"></h1>
                <p class="page-header__sub" data-i18n="quiz_picker_sub"></p>
            </div>
            <div class="topic-grid" id="topic-grid"></div>
        </div>

        <!-- Quiz Content (hidden until topic selected) -->
        <div id="quiz-content" class="hidden">

            <!-- Session bar -->
            <div class="session-info-bar">
                <button class="btn btn--ghost btn--sm btn--back" id="back-btn" aria-label="Volver al selector de temas" data-i18n-aria="back_to_topics_aria" data-i18n="back_to_topics"></button>
                <span id="quiz-counter" class="session-counter" role="status" aria-live="polite"></span>
                <span class="streak-badge" id="quiz-streak"></span>
            </div>
            <div class="progress-bar session-progress-bar" id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progreso de la sesión" data-i18n-aria="session_progress_aria"><div class="progress-bar__fill session-progress-fill" id="session-progress-fill"></div></div>

            <!-- Title + instruction -->
            <h1 class="page-header__title quiz-title" id="quiz-prompt"></h1>
            <p class="page-header__sub quiz-subtitle" data-i18n="quiz_sub"></p>

            <!-- Word card -->
            <div class="card word-card" id="word-card">
                <span class="word-category-badge" id="quiz-category"></span>
                <div class="quiz-word exercise-prompt" id="quiz-word" tabindex="-1" data-lang-target></div>
            </div>

            <!-- Answer choices -->
            <div class="choices-grid" id="choices-grid" role="group" aria-label="Opciones de respuesta" aria-describedby="quiz-prompt" data-i18n-aria="choices_grid_aria">
                <!-- Filled by JS -->
            </div>

            <!-- Feedback panel (hidden until answered) -->
            <div class="quiz-feedback hidden" id="quiz-feedback" role="status" aria-live="polite">
                <p class="feedback-result" id="feedback-result"></p>
                <div id="quiz-diff"></div>
                <div class="feedback-divider" id="feedback-divider"></div>
                <div class="feedback-note">
                    <span class="feedback-note-icon"><svg class="icon" aria-hidden="true"><use href="#i-message"/></svg></span>
                    <span class="feedback-note-text" id="feedback-example-text"></span>
                </div>
            </div>

            <!-- Next / Try Again (shown after answer) -->
            <div class="action-row action-row--quiz" id="action-row">
                <button class="btn btn--next hidden" id="next-btn" aria-label="Continuar a la siguiente pregunta" data-i18n-aria="next_question_aria" data-i18n="btn_next"></button>
                <button class="btn btn--retry hidden" id="try-again-btn" aria-label="Intentar esta pregunta de nuevo" data-i18n-aria="try_again_question_aria" data-i18n="btn_try_again"></button>
            </div>

        </div>

    </main>
